# 知屿 Nginx 反向代理（§6.1 接入层）
# 本地演示：监听 80（compose 映射 8080:80）；云端部署时在此基础上追加 TLS（§15.1）
#
# 注：不使用静态 upstream 块，改用 Docker 内嵌 DNS（127.0.0.11）+ 变量 proxy_pass，
#     使 app 容器重建（IP 变化）后 nginx 无需重启即可解析到新地址。

# 接口频率限制（模块 B1 防滥用）
limit_req_zone $binary_remote_addr zone=knowisle_req:10m rate=20r/s;
# v0.9 安全审计：认证端点（发码/验证/token）强力限流，每 IP 5 次/分，
# burst 容忍一次完整登录流程（发码+验证+token）与少量重试
limit_req_zone $binary_remote_addr zone=knowisle_auth:10m rate=5r/m;
# v0.9 安全审计：流式问答限频 + 单 IP 并发 SSE 连接数限制（防连接耗尽）
limit_req_zone $binary_remote_addr zone=knowisle_chat:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=knowisle_chat_conn:10m;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knowisle_app http://app:8000;

    client_max_body_size 55m;         # 与应用 50MB 上传上限对齐（留 5MB 表单开销）

    # v0.9 安全响应头；v1.0 追加 CSP：模板内联脚本已全部外置到 /static/js/（含页面脚本与
    # 设计令牌），CDN 全部本地化——script-src 收紧为 'self'；style 保留 'unsafe-inline'
    # （Tailwind Play CDN 运行时注入 <style>，记录在案）；iframe 预览与 SSE 均为同源。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # SSE 流式问答：关闭缓冲与缓存，逐 token 透传（§6.2）
    location /api/chat {
        limit_req zone=knowisle_chat burst=6 nodelay;
        limit_conn knowisle_chat_conn 4;    # 单 IP 最多 4 条并发 SSE
        proxy_pass $knowisle_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 认证端点（发码/验证/token）：独立强力限流（v0.9）
    location /api/auth/ {
        limit_req zone=knowisle_auth burst=10 nodelay;
        proxy_pass $knowisle_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=knowisle_req burst=40 nodelay;
        proxy_pass $knowisle_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
