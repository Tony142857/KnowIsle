# 知屿 Nginx 反向代理（§6.1 接入层）
# 本地演示：监听 80（compose 映射 8080:80）；云端部署时在此基础上追加 TLS（§15.1）
#
# 注：不使用静态 upstream 块，改用 Docker 内嵌 DNS（127.0.0.11）+ 变量 proxy_pass，
#     使 app 容器重建（IP 变化）后 nginx 无需重启即可解析到新地址。

# 接口频率限制（模块 B1 防滥用）
limit_req_zone $binary_remote_addr zone=knowisle_req:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knowisle_app http://app:8000;

    client_max_body_size 100m;        # 资料上传

    # SSE 流式问答：关闭缓冲与缓存，逐 token 透传（§6.2）
    location /api/chat {
        proxy_pass $knowisle_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=knowisle_req burst=40 nodelay;
        proxy_pass $knowisle_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
