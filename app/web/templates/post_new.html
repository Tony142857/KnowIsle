{% extends "base.html" %}
{% block title %}发帖 · 知屿 KnowIsle{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl" x-data="postNew('{{ board }}')" x-init="loadCourses()">
  <div class="mb-6">
    <a href="/boards/{{ board }}" class="text-sm text-sky-600 hover:underline">← {{ board_name }}</a>
    <h1 class="mt-2 text-2xl font-bold text-slate-800">发帖</h1>
  </div>

  <div class="space-y-4 rounded-lg border border-slate-200 bg-white p-6">
    <p x-show="error" x-text="error" x-cloak
       class="rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>

    {# 板块选择（qa / discuss） #}
    <div>
      <label class="block text-xs font-medium text-slate-500">板块</label>
      <div class="mt-1 flex gap-1 rounded-lg border border-slate-200 p-1 text-sm w-fit">
        <button @click="board = 'qa'" type="button"
                :class="board === 'qa' ? 'bg-sky-600 text-white font-medium' : 'text-slate-600 hover:bg-slate-100'"
                class="rounded-md px-4 py-1.5 transition-colors">知屿问答</button>
        <button @click="board = 'discuss'" type="button"
                :class="board === 'discuss' ? 'bg-sky-600 text-white font-medium' : 'text-slate-600 hover:bg-slate-100'"
                class="rounded-md px-4 py-1.5 transition-colors">讨论区</button>
      </div>
      <p class="mt-1 text-xs text-slate-400" x-show="board === 'qa'">
        问答帖发布后将由 AI 助教基于课程资料生成首答（标注"AI 生成，仅供参考"）。
      </p>
    </div>

    {# 课程（qa 必选）与章节（选填） #}
    <div>
      <label class="block text-xs font-medium text-slate-500">
        关联课程 <span x-show="board === 'qa'" class="text-red-500">*</span>
        <span x-show="board === 'discuss'" class="text-slate-400">（选填）</span>
      </label>
      <select x-model="courseId" @change="loadChapters()"
              class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm">
        <option value="">请选择课程</option>
        <template x-for="g in courseGroups" :key="g.major">
          <optgroup :label="g.major">
            <template x-for="c in g.items" :key="c.id">
              <option :value="c.id" x-text="c.name"></option>
            </template>
          </optgroup>
        </template>
      </select>
    </div>
    <div x-show="courseId" x-cloak>
      <label class="block text-xs font-medium text-slate-500">关联章节（选填）</label>
      <select x-model="chapterId"
              class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm">
        <option value="">不指定章节</option>
        <template x-for="ch in chapters" :key="ch.id">
          <option :value="ch.id" x-text="ch.label"></option>
        </template>
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500">标题 <span class="text-red-500">*</span></label>
      <input type="text" x-model="title" maxlength="128" placeholder="一句话说清楚你的问题或主题"
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm">
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500">正文 <span class="text-red-500">*</span></label>
      <textarea x-model="content" rows="10"
                placeholder="问题的背景、你已尝试的思路、希望得到的帮助…"
                class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm"></textarea>
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-500">标签（选填，逗号分隔，最多 5 个）</label>
      <input type="text" x-model="tagsInput" placeholder="如：期中复习, 习题课"
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2 text-sm">
    </div>

    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <a :href="'/boards/' + board"
         class="rounded-md border border-slate-300 px-4 py-2 text-sm text-slate-600 hover:bg-slate-100">取消</a>
      <button @click="submit()" :disabled="loading"
              class="rounded-md bg-sky-600 px-4 py-2 text-sm text-white hover:bg-sky-700 disabled:opacity-50">
        发布
      </button>
    </div>
  </div>
</div>

<script>
function postNew(initialBoard) {
  return {
    board: initialBoard,
    title: '', content: '', tagsInput: '',
    courseId: '', chapterId: '', courses: [], chapters: [],
    loading: false, error: '',

    // 课程下拉按专业分组（GET /api/courses 的 items 带 major_name）
    get courseGroups() {
      const groups = {};
      for (const c of this.courses) {
        const major = c.major_name || '未分专业';
        if (!groups[major]) groups[major] = {major: major, items: []};
        groups[major].items.push(c);
      }
      return Object.values(groups);
    },

    async loadCourses() {
      try {
        const resp = await fetch('/api/courses?size=100');
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('加载课程失败 ' + resp.status));
        this.courses = data.items || [];
      } catch (e) { this.error = e.message; }
    },

    async loadChapters() {
      this.chapterId = ''; this.chapters = [];
      if (!this.courseId) return;
      try {
        const resp = await fetch('/api/courses/' + this.courseId + '/chapters');
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('加载章节失败 ' + resp.status));
        // 章节树扁平化，用全角空格缩进体现层级
        const flat = [];
        const walk = (nodes, depth) => {
          for (const n of nodes || []) {
            flat.push({id: n.id, label: '　'.repeat(depth) + n.title});
            walk(n.children, depth + 1);
          }
        };
        walk(data.items, 0);
        this.chapters = flat;
      } catch (e) { this.error = e.message; }
    },

    parseTags() {
      return this.tagsInput.split(/[,，]/)
        .map(t => t.trim()).filter(t => t).slice(0, 5);
    },

    async submit() {
      this.error = '';
      if (!this.title.trim()) { this.error = '请填写标题'; return; }
      if (!this.content.trim()) { this.error = '请填写正文'; return; }
      if (this.board === 'qa' && !this.courseId) { this.error = '问答帖必须选择关联课程'; return; }
      this.loading = true;
      try {
        const resp = await fetch('/api/posts', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            board: this.board,
            title: this.title.trim(),
            content: this.content.trim(),
            course_id: this.courseId ? Number(this.courseId) : null,
            chapter_id: this.chapterId ? Number(this.chapterId) : null,
            tags: this.parseTags(),
          }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('发布失败 ' + resp.status));
        window.location.href = '/posts/' + data.post_id;
      } catch (e) { this.error = e.message; }
      finally { this.loading = false; }
    },
  };
}
</script>
{% endblock %}
